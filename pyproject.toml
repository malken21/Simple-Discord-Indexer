[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-discord-indexer"
version = "1.0.10"
description = "Discord server message log, thread, and attachment indexing tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "discord.py>=2.3.2",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
